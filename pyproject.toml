[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stackos-connectors"
version = "0.2.4"
description = "Named provider connectors with plain data and caller-owned authentication."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pydantic>=2.6",
    "cryptography>=43",
    "boto3>=1.43.51,<1.44",
    "botocore>=1.43.51,<1.44",
    "s3transfer>=0.19.1,<0.20",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-httpx>=0.34", "ruff>=0.8", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/stackos_connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
